name: Update GPS Assist Data

on:
  schedule:
    # 毎日日本時間の午前9:00（UTC 0:00）に実行
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dummy GPS assist data
        run: |
          mkdir -p AVCHD/AMAP
          python3 -c '
          chunk = b"SONY_GPS_ASSIST_DATA_PACKET_2026\n"
          dummy_data = chunk * ((15000 // len(chunk)) + 1)
          with open("AVCHD/AMAP/assistme.dat", "wb") as f:
              f.write(dummy_data)
          '
          
          # ファイルサイズが正常か（10KB以上か）チェック
          SIZE=$(wc -c < AVCHD/AMAP/assistme.dat)
          echo "Generated file size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "File is invalid (Size: $SIZE bytes)"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add AVCHD/AMAP/assistme.dat
          if git diff --staged --quiet; then
            echo "No changes in assistme.dat"
          else
            git commit -m "Auto update dummy assistme.dat"
            git push
          fi
