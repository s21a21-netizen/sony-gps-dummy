- name: Generate dummy GPS assist data
        run: |
          mkdir -p AVCHD/AMAP
          python3 -c '
          chunk = b"SONY_GPS_ASSIST_DATA_PACKET_2026\n"
          dummy_data = chunk * ((15000 // len(chunk)) + 1)
          with open("AVCHD/AMAP/assistme.dat", "wb") as f:
              f.write(dummy_data)
          '
          
          # ファイルサイズが正常か（10KB以上か）チェック
          SIZE=$(wc -c < AVCHD/AMAP/assistme.dat)
          echo "Generated file size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "File is invalid (Size: $SIZE bytes)"
            exit 1
          fi
