name: Update GPS Assist Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gps-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate GPS assist data
        run: |
          python scripts/generate_assistme.py

      - name: Verify generated file
        run: |
          FILE_PATH="AVCHD/AMAP/assistme.dat"
          if [ ! -f "$FILE_PATH" ]; then
            echo "Error: $FILE_PATH was not generated"
            exit 1
          fi          
          SIZE=$(wc -c < "$FILE_PATH")
          echo "Generated file size: $SIZE bytes"
          
          MIN_SIZE=30720  # 30KB
          MAX_SIZE=33792  # 33KB
          
          if [ "$SIZE" -lt "$MIN_SIZE" ] || [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "Warning: File size is outside expected range: $SIZE bytes"
          else
            echo "✓ File size is valid"
          fi
          
          MAGIC=$(xxd -l 4 -p "$FILE_PATH")
          echo "Magic number: $MAGIC"
          if [ "$MAGIC" != "414d4150" ]; then
            echo "Warning: Magic number does not match AMAP format"
          else
            echo "✓ Magic number is valid (AMAP format)"
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add AVCHD/AMAP/assistme.dat          
          if git diff --staged --quiet; then
            echo "No changes detected in assistme.dat"
          else
            git commit -m "Auto-generate assistme.dat GPS assist data"
            git push
            echo "✓ Successfully pushed updated assistme.dat"
          fi
